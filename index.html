<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="description" content="Fly through exoplanet systems discovered by NASA's TESS mission in a 3D galaxy map." />
    <title>TESS Galaxy Map</title>
    <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Ccircle cx='16' cy='16' r='6' fill='%23ffd27a'/%3E%3Ccircle cx='16' cy='16' r='12' fill='none' stroke='%233fa9d6' stroke-width='2'/%3E%3C/svg%3E" />
  </head>
  <body>
    <canvas id="scene" aria-label="3D map of TESS exoplanet host stars"></canvas>
    <div id="fade" aria-hidden="true"></div>

    <header class="hud hud-top">
      <nav id="breadcrumb" aria-label="Location"></nav>
      <div class="brand">TESS <span>Galaxy Map</span></div>
    </header>

    <aside class="hud hud-left panel" aria-label="Star systems">
      <h2>Systems <span id="count"></span></h2>
      <label class="field">
        <span>Search</span>
        <input id="search" type="search" placeholder="Name or TIC ID" autocomplete="off" />
      </label>
      <div class="filters">
        <label class="field">
          <span>Planets</span>
          <select id="min-planets">
            <option value="1">Any</option>
            <option value="2">2+</option>
            <option value="3">3+</option>
            <option value="4">4+</option>
          </select>
        </label>
        <label class="field">
          <span>Within</span>
          <select id="max-distance">
            <option value="">Any</option>
            <option value="15">15 pc</option>
            <option value="30">30 pc</option>
            <option value="100">100 pc</option>
          </select>
        </label>
        <label class="field">
          <span>Has</span>
          <select id="size-class">
            <option value="any">Any size</option>
            <option value="earth">Earth-size</option>
            <option value="super-earth">Super-Earth</option>
            <option value="neptune">Neptune-like</option>
            <option value="giant">Giant</option>
          </select>
        </label>
      </div>
      <ul id="system-list" class="system-list"></ul>
      <label class="toggle">
        <input id="reduced-motion" type="checkbox" />
        <span>Reduce motion</span>
      </label>
    </aside>

    <aside id="info" class="hud hud-right panel" aria-live="polite" hidden></aside>

    <footer class="hud hud-bottom">
      <div id="hint"></div>
      <div id="data-credit"></div>
    </footer>

    <div id="reticle" class="reticle" hidden><span></span></div>
    <div id="labels" aria-hidden="true"></div>
    <div id="loading" class="loading">Calibrating star charts…</div>

    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
